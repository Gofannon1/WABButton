<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Tell the browser what characters to use -->
    <meta charset="UTF-8">
    <!-- Make the page work nicely on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title shown in the browser tab -->
    <title>WAB App</title>
    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main heading -->
    <h1 id="message">Click the button!</h1>
    <!-- Button that runs JavaScript when clicked -->
    <button id="wabButton">Press Me</button>
    <!-- Burger image, hidden until the button is clicked -->
    <img id="burgerImage" src="burger.webp" alt="A burger" style="display: none;">
    <!-- Connect the JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
